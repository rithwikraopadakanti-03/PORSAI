
services:
  db:
    image: postgres:16
    container_name: porsai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunrise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunrise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: porsai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sunrise
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
